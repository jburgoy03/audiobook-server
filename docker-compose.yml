services:
  db:
    image: postgres:17-alpine
    container_name: audiobook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: audiobook
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - audiobook-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook -d audiobook"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  audiobook-db-data: